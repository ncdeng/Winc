[package]
name = "winc-preview"
description = "预览的解析和光栅化：图片解码（PNG、JPEG、GIF、WebP、BMP、ICO）、SVG、Markdown（含公式和 mermaid）。不依赖编辑器和 GUI。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
memchr.workspace = true
png.workspace = true
zune-jpeg.workspace = true
gif.workspace = true
image-webp.workspace = true
roxmltree.workspace = true
# 读 xlsx（zip 压缩包）中 deflate 压缩的文件；png 已经用到同一版本，不多出新的 crate。
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
pulldown-cmark.workspace = true
zeno.workspace = true
winc-i18n.workspace = true

# macOS：要缩小的 JPEG 交给 ImageIO 按目标大小解码（见 src/image/imageio.rs），PDF 由 CoreGraphics
# 渲染（见 src/pdf/mac.rs）。和 winc-render 用的是同一版本的绑定，不多出新的 crate。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFDictionary", "CFNumber", "CFString", "CFCGTypes", "CFURL"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }

# Windows：PDF 由系统的 `Windows.Data.Pdf` 渲染、WIC 解码（见 src/pdf/win.rs）。只开用到的 WinRT
# 命名空间。`pdfium.dll` 存在时改用 PDFium（见 src/pdf/pdfium.rs），用 `LoadLibraryExW` 在运行时
# 加载，不在构建时链接；安装包不带它，用户需要时下载（见 src/pdf/pdfium/install.rs）。下载的安装包
# 用 SHA-256 核对：sha2 已经随 winc-app 的 ed25519-dalek 在依赖树里，不多出新的 crate。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", default-features = false, features = ["std", "Data_Pdf", "Foundation", "Graphics_Imaging", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_LibraryLoader"] }
sha2 = { version = "0.10", default-features = false }

[lints]
workspace = true
